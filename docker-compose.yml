version: '3.8'
services:
  db:
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: sistema
    volumes:
      - db-data:/var/lib/postgresql/data
  web:
    build: .
    command: gunicorn setup.wsgi:application --bind 0.0.0.0:8000 --workers 2
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgres://postgres:postgres@db:5432/sistema
      DJANGO_SECRET_KEY: super-secret-local
      DEBUG: 'True'
    depends_on:
      - db
volumes:
  db-data:

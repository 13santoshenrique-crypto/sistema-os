{% extends 'base.html' %}

{% block content %}
<div class="row">
    <div class="col-md-8">
        <h3>Locais</h3>
        <ul class="list-group">
            {% for local in locais %}
            <li class="list-group-item d-flex justify-content-between align-items-center">
                {{ local.nome }}
                <span class="badge bg-secondary">{{ local.tecnicos.count }} técnicos</span>
            </li>
            {% endfor %}
        </ul>
    </div>
    <div class="col-md-4">
        <h4>Adicionar Local</h4>
        <form method="post">{% csrf_token %}
            {{ form.as_p }}
            <button class="btn btn-primary">Salvar</button>
        </form>
    </div>
</div>
{% endblock %}
